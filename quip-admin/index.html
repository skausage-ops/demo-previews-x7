<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B1713">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>QUIP · QA Admin</title>
<style>
@font-face{font-family:"Archivo Black";src:url(../shared/fonts/archivo-black-400-latin.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(../shared/fonts/barlow-condensed-400-latin.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(../shared/fonts/barlow-condensed-500-latin.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(../shared/fonts/barlow-condensed-600-latin.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(../shared/fonts/barlow-condensed-700-latin.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Barlow Semi Condensed";src:url(../shared/fonts/barlow-semi-condensed-400-latin.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow Semi Condensed";src:url(../shared/fonts/barlow-semi-condensed-500-latin.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Barlow Semi Condensed";src:url(../shared/fonts/barlow-semi-condensed-600-latin.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"DM Sans";src:url(../shared/fonts/dm-sans-latin.woff2) format("woff2");font-weight:100 1000;font-display:swap}

:root{
  --gold:#F4A525;--gold-deep:#B8791A;--gold-soft:#FDF1DC;--red:#9A3324;--red-soft:#FBEAE6;--red-onblack:#F76B52;
  --black-deep:#0A0908;--black-soft:#1B1713;--success:#15803D;--success-soft:#E7F5EC;
  --blue:#1D4ED8;--blue-soft:#E6EEFC;--teal:#0F766E;--teal-soft:#E3F4F2;--grey-soft:#EFEDEA;
  --bg:#FAFAF9;--surface:#FFFFFF;--raised:#F5F4F2;--border:#E2DDD9;--border-strong:#CFC8C2;
  --text:#1B1713;--muted:#6B625C;--faint:#958B84;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--semi:"Barlow Semi Condensed","Arial Narrow",sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
  --r:10px;--r-sm:6px;--shadow:0 1px 2px rgba(27,23,19,.06),0 2px 8px rgba(27,23,19,.05);--shadow-lg:0 12px 40px rgba(10,9,8,.22);
  --side:236px;--top:60px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh;min-height:100dvh}
.side{background:var(--black-soft);color:#E9E4DF;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:40;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 16px;text-decoration:none;color:#fff}
.brand img{width:44px;height:44px;object-fit:contain;flex:none}
.brand b{display:block;font:700 26px/1 var(--display);letter-spacing:.06em}
.brand small{display:block;font:500 12.5px/1.2 var(--semi);color:var(--gold);letter-spacing:.02em;margin-top:3px;white-space:nowrap}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav h6{margin:14px 10px 6px;font:600 11.5px/1 var(--semi);text-transform:uppercase;letter-spacing:.12em;color:#8C8179}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;text-decoration:none;color:#D6CFC8;font:500 16.5px/1.1 var(--semi);white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:rgba(244,165,37,.12);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.nav a.on svg{color:var(--gold)}
.nav .cnt{margin-left:auto;background:var(--gold);color:var(--black-deep);font:700 12px/1 var(--body);padding:3px 7px;border-radius:99px}
.nav .cnt.red{background:var(--red-onblack)}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--black-deep);display:grid;place-items:center;font:700 15px/1 var(--display);flex:none}
.side-foot .who{font:600 14.5px/1.15 var(--semi);color:#fff;white-space:nowrap}
.side-foot .who small{display:block;font:400 12.5px var(--semi);color:#A39890}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 20px 0;background:rgba(250,250,249,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.top .burger{display:none}
.search{position:relative;flex:1;max-width:460px}
.search input{width:100%;height:40px;border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:0 14px 0 40px;outline:none;font-size:14.5px}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,165,37,.2)}
.search > svg{position:absolute;left:14px;top:11px;color:var(--muted)}
.drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden;z-index:60;max-height:min(420px,70vh);overflow-y:auto}
.drop .row{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--raised);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.drop .row:hover,.drop .row.hl{background:var(--raised)}
.drop .empty{padding:14px;color:var(--muted);font-size:14px}
.top-sp{flex:1}
.demo-pill{font:600 12.5px/1 var(--semi);letter-spacing:.04em;text-transform:uppercase;background:var(--gold-soft);color:#7A4E0C;border:1px solid #F2D6A6;padding:7px 10px;border-radius:99px;white-space:nowrap}
.iconbtn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--raised)}
.iconbtn .badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font:700 11px/19px var(--body);text-align:center;border:2px solid var(--bg)}
.userbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:4px 12px 4px 4px;height:42px}
.userbtn .av{width:32px;height:32px;font-size:14px}
.userbtn span{font:600 14.5px/1 var(--semi);white-space:nowrap}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:270px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;z-index:60}
.menu .mh{padding:10px 12px 8px;border-bottom:1px solid var(--raised);margin-bottom:4px}
.menu .mh b{display:block;font:600 16px var(--semi)}
.menu .mh small{color:var(--muted)}
.menu button,.menu a{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:left;text-decoration:none;font-size:14.5px}
.menu button:hover,.menu a:hover{background:var(--raised)}
.menu .danger{color:var(--red)}
.notif{width:340px;max-width:calc(100vw - 24px);padding:0}
.notif .mh{padding:12px 14px}
.notif .nrow{display:block;padding:11px 14px;border-bottom:1px solid var(--raised);cursor:pointer}
.notif .nrow:hover{background:var(--raised)}
.notif .nrow b{font-weight:600;font-size:14px}
.notif .nrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.notif .nfoot{padding:10px 14px;font-size:12.5px;color:var(--muted);background:var(--raised)}
.rel{position:relative}

.view{padding:22px 24px 60px;max-width:1360px;width:100%;margin:0 auto;min-width:0}
.scrim{display:none}

/* ---------- type & primitives ---------- */
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.005em;margin:0;line-height:1.05}
h1{font-size:34px}
h2{font-size:23px}
h3{font-size:19px;font-weight:600}
.eyebrow{font:600 12.5px/1 var(--semi);text-transform:uppercase;letter-spacing:.12em;color:var(--gold-deep)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead p{margin:6px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:99px;font:600 13px/1.1 var(--semi);letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.t-gold{background:var(--gold-soft);color:#875708;border-color:#F3DDB4}
.t-blue{background:var(--blue-soft);color:var(--blue);border-color:#CCDAF8}
.t-red{background:var(--red-soft);color:var(--red);border-color:#F1CFC7}
.t-green{background:var(--success-soft);color:var(--success);border-color:#C7E7D2}
.t-grey{background:var(--grey-soft);color:#5C544E;border-color:#E0DBD6}
.sev{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:5px;font:700 12px/1.1 var(--semi);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.sev-High{background:var(--red);color:#fff}
.sev-Medium{background:var(--gold-soft);color:#875708;box-shadow:inset 0 0 0 1px #F3DDB4}
.sev-Low{background:var(--grey-soft);color:#5C544E}
.sev-none{color:var(--faint);font:500 13px var(--semi)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font:700 11px/1.2 var(--semi);text-transform:uppercase;letter-spacing:.08em;background:var(--black-soft);color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);font:600 15.5px/1 var(--semi);letter-spacing:.02em;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--raised)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--black-deep)}
.btn.pri:hover{background:#E99A18}
.btn.dark{background:var(--black-soft);border-color:var(--black-soft);color:#fff}
.btn.dark:hover{background:#2E2721}
.btn.danger{color:var(--red);border-color:#E8C3BB}
.btn.danger:hover{background:var(--red-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--raised)}
.btn.sm{height:34px;padding:0 12px;font-size:14.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font:600 14.5px/1 var(--semi);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip b{font-family:var(--body);font-size:12px;background:var(--raised);padding:2px 7px;border-radius:99px}
.chip.on{background:var(--black-soft);color:#fff;border-color:var(--black-soft)}
.chip.on b{background:var(--gold);color:var(--black-deep)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font:600 13px/1 var(--semi);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.inp,select.inp,textarea.inp{height:42px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);padding:0 12px;outline:none;width:100%;min-width:0}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,165,37,.2)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:42px;padding:0 16px;font:600 15px var(--semi);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--black-soft);color:#fff}
.seg button.on.High{background:var(--red)}
.seg button.on.Medium{background:var(--gold);color:var(--black-deep)}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:#D5CEC8;border:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--success)}
.switch.on::after{transform:translateX(20px)}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{position:sticky;top:0;background:var(--raised);text-align:left;font:600 12.5px/1 var(--semi);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:11px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.t td{padding:11px 10px;border-bottom:1px solid #EEEAE6;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:#FBF8F3}
.t .ref{font:600 13.5px var(--mono);white-space:nowrap}
.t .nowrap{white-space:nowrap}
.t .hl{min-width:180px;max-width:280px}
.t .ty{min-width:96px;max-width:140px;line-height:1.3}
.t .hl b{display:block;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t .hl small{color:var(--muted);font-size:12.5px}
.thumbs{display:flex;align-items:center}
.thumbs img,.thumbs .ph{width:34px;height:34px;border-radius:6px;object-fit:cover;border:2px solid var(--surface);margin-left:-10px;background:var(--raised)}
.thumbs img:first-child,.thumbs .ph:first-child{margin-left:0}
.thumbs em{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:6px}
.overdue{display:inline-flex;align-items:center;gap:4px;color:var(--red);font:700 12px var(--semi);text-transform:uppercase;letter-spacing:.06em}
.newdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:6px;box-shadow:0 0 0 3px rgba(244,165,37,.25)}

/* ---------- brief ---------- */
.hero{background:var(--black-soft);color:#fff;border-radius:14px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;overflow:hidden;margin-bottom:16px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(244,165,37,.28),transparent 70%)}
.hero h1{font-size:40px;color:#fff}
.hero p{margin:6px 0 0;color:#CFC6BE}
.hero .quote{position:relative;z-index:1;max-width:320px;font:500 16px/1.3 var(--semi);color:var(--gold);border-left:3px solid var(--gold);padding-left:12px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{display:block;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 13px;text-decoration:none;position:relative;overflow:hidden;min-width:0}
a.kpi:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.kpi .k{font:600 12.5px/1.2 var(--semi);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);min-height:30px}
.kpi .v{font:700 40px/1 var(--display);margin:8px 0 4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted);line-height:1.3}
.kpi.alert{border-color:#EBC2B9}
.kpi.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.kpi.alert .v{color:var(--red)}
.kpi.good .v{color:var(--success)}
.kpi.goldk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid #EEEAE6;cursor:pointer}
.todo li:last-child{border-bottom:0}
.todo li:hover{background:#FBF8F3}
.todo .n{width:30px;height:30px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font:700 16px var(--display)}
.todo li.urgent .n{background:var(--red);color:#fff}
.todo .why{font:600 13px/1.2 var(--semi);text-transform:uppercase;letter-spacing:.06em;color:var(--gold-deep);margin-bottom:3px}
.todo li.urgent .why{color:var(--red)}
.todo .what{font-weight:600;line-height:1.3}
.todo .meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.brief-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.mini{display:flex;flex-direction:column;gap:10px}
.mini .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px dashed var(--border)}
.mini .r:last-child{border-bottom:0}

/* ---------- queue ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.filters .inp{height:38px;width:auto;font-size:14px}
.filters .q{flex:1;min-width:180px}
.qsummary{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border);background:#FDFCFA}
.qsummary b{font:700 20px var(--display)}
.toggle{display:inline-flex;align-items:center;gap:10px;font:600 14.5px var(--semi);background:none;border:0;padding:0}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font:600 15px var(--semi);color:var(--muted);text-decoration:none;margin-bottom:12px}
.back:hover{color:var(--text)}
.dhead{padding:18px 20px}
.dhead .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dhead h1{font-size:31px;line-height:1.1;max-width:900px}
.dmeta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:14px;color:var(--muted)}
.dmeta span{display:inline-flex;align-items:center;gap:6px}
.dmeta b{color:var(--text);font-weight:600}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);padding:16px 20px 18px}
.st{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font:600 13.5px/1.15 var(--semi);color:var(--faint)}
.st::before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:3px;background:var(--border);z-index:0}
.st:first-child::before{display:none}
.st .dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong);display:grid;place-items:center}
.st .dot svg{width:15px;height:15px}
.st small{font:400 12px var(--body);color:var(--faint)}
.st.done{color:var(--text)}
.st.done .dot{background:var(--success);border-color:var(--success);color:#fff}
.st.done::before{background:var(--success)}
.st.cur{color:var(--text)}
.st.cur .dot{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 4px rgba(244,165,37,.2)}
.st.cur .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.st.cur::before{background:linear-gradient(90deg,var(--success),var(--gold))}
.st.warn .dot{border-color:var(--red);background:var(--red-soft)}
.st.warn .dot::after{background:var(--red)}
.st.warn small{color:var(--red);font-weight:600}
.actionbar{position:sticky;top:calc(var(--top) + env(safe-area-inset-top));z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin:12px 0 14px;background:rgba(27,23,19,.97);border-radius:12px;box-shadow:var(--shadow-lg)}
.actionbar .lead{color:#CFC6BE;font:500 14px var(--semi);margin-right:auto;padding:0 6px;display:flex;align-items:center;gap:8px;min-width:0}
.actionbar .lead b{color:#fff;font-weight:600}
.actionbar .btn{height:40px;background:#2B241F;border-color:#3D342D;color:#F2EDE8}
.actionbar .btn:hover{background:#3A3029}
.actionbar .btn.pri{background:var(--gold);border-color:var(--gold);color:var(--black-deep)}
.actionbar .btn.danger{color:var(--red-onblack)}
.dcols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:16px;align-items:start}
.gallery .main-ph{position:relative;aspect-ratio:4/3;background:var(--black-deep);border-radius:var(--r) var(--r) 0 0;overflow:hidden;cursor:zoom-in;border:0;padding:0;width:100%;display:block}
.gallery .main-ph img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .cap{position:absolute;left:12px;bottom:12px;background:rgba(10,9,8,.75);color:#fff;font:600 13.5px var(--semi);padding:6px 10px;border-radius:6px;display:flex;gap:8px;align-items:center}
.gallery .zoom{position:absolute;right:12px;bottom:12px;background:rgba(10,9,8,.75);color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.gallery .strip{display:flex;gap:8px;padding:10px;overflow-x:auto}
.gallery .strip button{border:2px solid transparent;border-radius:8px;padding:0;background:none;flex:none;position:relative}
.gallery .strip button.on{border-color:var(--gold)}
.gallery .strip img{width:92px;height:68px;object-fit:cover;border-radius:6px;display:block}
.gallery .strip span{position:absolute;left:4px;bottom:4px;background:rgba(10,9,8,.7);color:#fff;font:600 11px var(--semi);padding:1px 5px;border-radius:4px}
.nophotos{padding:40px 20px;text-align:center;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.fact{padding:12px 16px;border-bottom:1px solid #EEEAE6;min-width:0}
.fact:nth-child(odd){border-right:1px solid #EEEAE6}
.fact.full{grid-column:1/-1;border-right:0}
.fact .lbl{display:block;margin-bottom:5px;font-size:11.5px}
.fact .val{font-weight:600;overflow-wrap:anywhere}
.fact .sub{font-size:13px;color:var(--muted);margin-top:2px}
.flag{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-weight:700}
.desc{font-size:15.5px;line-height:1.6;margin:0;white-space:pre-wrap}
.tl{list-style:none;margin:0;padding:6px 16px 16px}
.tl li{position:relative;padding:12px 0 12px 30px}
.tl li::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.tl li:first-child::before{top:18px}
.tl li:last-child::before{bottom:calc(100% - 18px)}
.tl .dot{position:absolute;left:1px;top:13px;width:16px;height:16px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.tl .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl .who b{font:600 15px var(--semi)}
.tl .role{font:700 10.5px/1 var(--semi);text-transform:uppercase;letter-spacing:.09em;padding:3px 6px;border-radius:4px}
.tl time{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tl p{margin:5px 0 0;font-size:14.5px;line-height:1.5}
.tl li.internal p{background:#FFF9EC;border:1px dashed #EBCF97;border-radius:8px;padding:8px 10px}
.r-store .dot{background:var(--gold)} .r-store .role{background:var(--gold-soft);color:#875708}
.r-qa .dot{background:var(--red)} .r-qa .role{background:var(--red-soft);color:var(--red)}
.r-supplier .dot{background:var(--blue)} .r-supplier .role{background:var(--blue-soft);color:var(--blue)}
.r-dc .dot{background:var(--teal)} .r-dc .role{background:var(--teal-soft);color:var(--teal)}
.r-system .dot{background:#A39890} .r-system .role{background:var(--grey-soft);color:#5C544E}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);font-size:14px;line-height:1.45}
.banner svg{margin-top:1px}
.banner.red{background:var(--red-soft);color:#6E2418;border:1px solid #F1CFC7}
.banner.gold{background:var(--gold-soft);color:#6B4508;border:1px solid #F3DDB4}
.banner.green{background:var(--success-soft);color:#0F5A2B;border:1px solid #C7E7D2}
.banner.blue{background:var(--blue-soft);color:#173C9E;border:1px solid #CCDAF8}

/* ---------- charts ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--body);font-size:11.5px;fill:var(--muted)}
.chart .val{fill:var(--text);font-weight:600}
.chart .bar{transition:opacity .15s}
.chart .bar:hover{opacity:.8}
.hbar{display:grid;grid-template-columns:minmax(110px,170px) 1fr 40px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:14px;background:var(--raised);border-radius:0 4px 4px 0;overflow:hidden}
.hbar .fill{height:100%;background:var(--gold-deep);border-radius:0 4px 4px 0}
.hbar .num{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 14px}
.stack div{height:100%}
.mocknote{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--semi);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--raised);border:1px dashed var(--border-strong);padding:4px 8px;border-radius:6px}
.tip{position:fixed;pointer-events:none;z-index:120;background:var(--black-soft);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:6px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .1s;white-space:nowrap}
.spark{display:block}

/* ---------- suppliers ---------- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.scard{display:block;text-align:left;width:100%;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.scard:hover{transform:translateY(-2px);border-color:var(--gold)}
.scard .sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo-sq{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font:700 17px var(--display);color:#fff;flex:none}
.scard h3{font-size:21px}
.scard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scard .stat{background:var(--raised);border-radius:8px;padding:8px 10px}
.scard .stat b{display:block;font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.scard .stat small{font-size:11.5px;color:var(--muted)}
.scard .stat.bad b{color:var(--red)}
.scard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}

/* ---------- admin ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:11px 14px;font:600 15.5px var(--semi);text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--text);border-bottom-color:var(--gold)}
.empty-state{text-align:center;padding:56px 24px;max-width:560px;margin:0 auto}
.empty-state .ico{width:72px;height:72px;border-radius:50%;background:var(--gold-soft);color:var(--gold-deep);display:grid;place-items:center;margin:0 auto 18px}
.empty-state .ico svg{width:34px;height:34px}
.empty-state h2{font-size:30px;margin-bottom:8px}
.sop{counter-reset:s;list-style:none;margin:0;padding:0}
.sop > li{counter-increment:s;position:relative;padding:16px 16px 16px 64px;border-bottom:1px solid #EEEAE6}
.sop > li:last-child{border-bottom:0}
.sop > li::before{content:counter(s);position:absolute;left:16px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--black-soft);color:var(--gold);display:grid;place-items:center;font:700 18px var(--display)}
.sop h3{margin-bottom:6px}
.sop ul{margin:6px 0 0;padding-left:18px;color:#3D3530;font-size:14.5px}
.sop ul li{margin:3px 0}

/* ---------- overlays ---------- */
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--black-soft);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:14.5px;animation:tin .25s ease-out;border-left:4px solid var(--gold)}
.toast.ok{border-left-color:#3FBF6E}
.toast.warn{border-left-color:var(--red-onblack)}
.toast button{background:none;border:0;color:var(--gold);font:600 14px var(--semi);padding:0 0 0 6px}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;background:rgba(10,9,8,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:min(620px,100%);max-height:calc(100dvh - 40px);display:flex;flex-direction:column;animation:pop .18s ease-out}
.modal.wide{width:min(760px,100%)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.modal .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px}
.modal .mh h2{font-size:26px}
.modal .mh p{margin:4px 0 0;color:var(--muted);font-size:14px}
.modal .mb{padding:4px 20px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal .mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:#FDFCFA;border-radius:0 0 14px 14px;flex-wrap:wrap}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border-strong);border-radius:10px;padding:12px;cursor:pointer;text-align:left;background:var(--surface)}
.radio.on{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 2px rgba(244,165,37,.35)}
.radio.dis{opacity:.5;cursor:not-allowed}
.radio b{display:block;font:600 16px var(--semi)}
.radio small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
.radio .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);flex:none;margin-top:2px}
.radio.on .rd{border:6px solid var(--black-soft)}
.msgprev{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.msgprev .hd{background:var(--raised);padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:62px 1fr;gap:4px 8px}
.msgprev .hd span{color:var(--muted)}
.msgprev .bd{padding:14px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.msgprev .att{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.msgprev .att figure{margin:0;width:96px}
.msgprev .att img{width:96px;height:70px;object-fit:cover;border-radius:6px;display:block}
.msgprev .att figcaption{font-size:11.5px;color:var(--muted);margin-top:3px}
.msgprev.teams{border-left:4px solid #5B5FC7}
.lightbox{position:fixed;inset:0;z-index:150;background:rgba(10,9,8,.96);display:flex;flex-direction:column;animation:fade .15s;touch-action:pan-y}
.lightbox .lh{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;color:#fff}
.lightbox .lh b{font:600 18px var(--semi)}
.lightbox .lh small{color:#A39890;margin-left:10px}
.lightbox .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.lightbox .stage img{max-width:calc(100% - 140px);max-height:100%;object-fit:contain;border-radius:6px;user-select:none;-webkit-user-drag:none;transition:transform .2s}
.lightbox .nav-b{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;display:grid;place-items:center}
.lightbox .nav-b:hover{background:rgba(255,255,255,.2)}
.lightbox .nav-b svg{width:26px;height:26px}
.lightbox .prev{left:16px}.lightbox .next{right:16px}
.lightbox .lf{display:flex;justify-content:center;gap:8px;padding:12px 12px calc(16px + env(safe-area-inset-bottom))}
.lightbox .lf button{border:2px solid transparent;padding:0;border-radius:6px;background:none;opacity:.55}
.lightbox .lf button.on{border-color:var(--gold);opacity:1}
.lightbox .lf img{width:64px;height:48px;object-fit:cover;border-radius:4px;display:block}
.lightbox .close{background:rgba(255,255,255,.1);border:0;color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.celebrate{position:fixed;inset:0;z-index:180;display:grid;place-items:center;background:rgba(10,9,8,.5);animation:fade .2s;overflow:hidden}
.celebrate .box{background:var(--surface);border-radius:18px;padding:24px 32px 26px;text-align:center;box-shadow:var(--shadow-lg);animation:pop .3s ease-out;max-width:380px;position:relative;z-index:2}
.celebrate img{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto 6px}
.celebrate h2{font-size:32px}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 1.8s ease-in forwards;z-index:1}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* ---------- responsive ---------- */
@media (max-width:1240px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi-row{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1100px){
  :root{--side:76px}
  .brand{justify-content:center;padding:16px 8px}
  .brand div,.nav h6,.nav a span,.nav .cnt,.side-foot .who{display:none}
  .nav h6{display:block;height:1px;background:rgba(255,255,255,.1);margin:10px 8px;font-size:0}
  .nav a{justify-content:center;padding:12px}
  .nav a svg{width:22px;height:22px}
  .nav a .dotc{position:absolute;top:7px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--gold);display:block}
  .side-foot{justify-content:center;padding:14px 8px}
  .dcols{grid-template-columns:1fr}
  .brief-cols{grid-template-columns:1fr}
  .hero .quote{display:none}
}
.nav a .dotc{display:none}
@media (max-width:1100px){.nav a .dotc{display:block}}
@media (max-width:860px){
  .charts{grid-template-columns:1fr}
  .userbtn span:not(.av){display:none}
  .userbtn{padding:4px}
  .view{padding:18px 16px 60px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:699px){
  :root{--side:0px}
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform .22s ease-out}
  body.drawer .side{transform:none;box-shadow:var(--shadow-lg)}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(10,9,8,.45);z-index:35}
  .brand{justify-content:flex-start;padding:18px}
  .brand div,.nav a span,.nav .cnt,.side-foot .who{display:block}
  .nav h6{display:block;height:auto;background:none;margin:14px 10px 6px;font-size:11.5px}
  .nav a{justify-content:flex-start;padding:10px 12px}
  .nav a svg{width:18px;height:18px}
  .nav a .dotc{display:none}
  .nav .cnt{display:inline-block}
  .side-foot{justify-content:flex-start;padding:14px 16px}
  .top .burger{display:grid}
  .todo li{grid-template-columns:30px 1fr;gap:10px}
  .todo li > .btn{display:none}
  .top{padding-left:12px;padding-right:12px;gap:8px}
  .demo-pill{display:none}
  h1{font-size:28px}
  .hero{padding:18px}
  .hero h1{font-size:32px}
  .dhead h1{font-size:25px}
  .stepper{grid-template-columns:1fr;gap:10px;padding:14px 16px}
  .st{flex-direction:row;text-align:left;gap:10px}
  .st::before{display:none}
  .st small{margin-left:auto}
  .facts{grid-template-columns:1fr}
  .fact:nth-child(odd){border-right:0}
  .radios{grid-template-columns:1fr}
  .lightbox .stage img{max-width:100%}
  .lightbox .nav-b{display:none}
  .actionbar .lead{width:100%}
  .scard .stats{grid-template-columns:repeat(3,1fr)}
  .hbar{grid-template-columns:96px 1fr 34px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .confetti{display:none}
}
</style>

<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <a class="brand" href="#/brief">
      <img src="../shared/brand/logo-wht-yellow.webp" alt="Church's Texas Chicken">
      <div><b>QUIP</b><small>QA Intelligence Portal</small></div>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="av">T</div>
      <div class="who">Tasha<small>QA Lead (demo)</small></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="iconbtn burger" id="burger" aria-label="Open menu"></button>
      <div class="search" id="searchBox">
        <span id="searchIco"></span>
        <input id="search" type="search" placeholder="Search ref, lot, store, item…" autocomplete="off" aria-label="Search incidents">
        <div class="drop" id="searchDrop" hidden></div>
      </div>
      <div class="top-sp"></div>
      <span class="demo-pill">Demo · mock data</span>
      <div class="rel">
        <button class="iconbtn" id="bell" aria-label="Notifications"></button>
        <div class="menu notif" id="bellMenu" hidden></div>
      </div>
      <div class="rel">
        <button class="userbtn" id="userBtn" aria-haspopup="true"><span class="av">T</span><span>Tasha · QA Lead (demo)</span></button>
        <div class="menu" id="userMenu" hidden></div>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tip" id="tip"></div>
<div id="overlay"></div>

<script src="../shared/quip-data.js"></script>
<script>
(function(){

const H = 3600e3, D = 24 * H;
const ME = 'Tasha (QA)';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- icons (lucide-style) ---------- */
const P = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

  const edits = readEdits();

    const e = edits[i.ref] || {};
    const dc = e.routeDc || i.dc || (i.store && i.store.dc) || null;
    const baseSup = i.vendor ? supByVendor(i.vendor) : null;
    const sup = e.routeSupplier ? supByKey(e.routeSupplier) : baseSup;
    const credit = e.credit != null ? e.credit : (i.credit || 0);
    const tl = i.timeline.slice().sort((a, b) => a.at - b.at);
    const lastNotify = [...tl].reverse().find(s => s.kind === 'notify');
    const respAfter = lastNotify ? tl.some(s => s.kind === 'response' && s.at >= lastNotify.at) : false;
    const hasResponse = tl.some(s => s.kind === 'response');
    const open = !['Resolved','ClosedNoAction'].includes(i.status);
    const waiting = i.status === 'SupplierNotified' || i.status === 'AwaitingDcAction';
    const overdue = open && waiting && (i.chaseOverdue || (lastNotify && !respAfter && Date.now() - lastNotify.at > 48 * H));
    const resolvedAt = (tl.find(s => s.kind === 'resolve' || s.kind === 'close') || {}).at || null;
    let waitingOn = i.statusInfo ? i.statusInfo.waitingOn : null;
    if (i.status === 'SupplierNotified') waitingOn = sup ? sup.name : 'Supplier';
    if (i.status === 'AwaitingDcAction') waitingOn = dc || 'Distribution center';
    if (i.status === 'Escalated') waitingOn = 'QA lead';
    const needsQA = open && (['PendingIntake','IntakeComplete','Escalated'].includes(i.status) || (waiting && respAfter) || overdue);
    return { ...i, timeline: tl, dc, sup, credit, open, overdue, respAfter, hasResponse, lastNotify, resolvedAt, waitingOn, needsQA,

  });

function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const HIST = (() => {
  const r = rng(1147), out = [];
  const typesW = [['Foreign Object',3],['Spoilage',2],['Temperature',4],['Underfilled / Underweight',4],['External Damage',5],['Appearance and Size',4],['Mis-labeled / Missing label',2],['Off Flavor / Odor',1],['Driver Late',3],['Short / Missing Product',4]];
  const supW = [['mccain',4],['lambweston',5],['koch',4],['casefarms',4],['greengate',3],['ardent',3],['huhtamaki',2]];
  const storeW = [['1147',4],['1162',3],['1188',3],['10189',4],['3011',2],['11598',2],['959',2],['2240',2]];
  const pick = w => { const t = w.reduce((a, b) => a + b[1], 0); let x = r() * t; for (const [k, n] of w) { if ((x -= n) < 0) return k; } return w[0][0]; };
  const perWeek = [3,4,3,5,4,6,5,7,6,8,7,0]; // week 11 = this week (live data only)
  perWeek.forEach((n, w) => { for (let k = 0; k < n; k++) {
    const type = pick(typesW), service = TYPE_Q[type] && TYPE_Q[type].group === 'Service';
    const store = pick(storeW);
    out.push({ week:w, type, sup: service ? null : pick(supW), store, days: +(0.8 + r() * 4.2).toFixed(1), replyHrs: Math.round(8 + r() * 52),
      complete: r() < .93, credit: service ? 0 : (r() < .55 ? Math.round(30 + r() * 220) : 0), sev: TYPE_Q[type] && TYPE_Q[type].high ? 'High' : (r() < .7 ? 'Medium' : 'Low') });
  }});
  return out;
})();

}

function stepSummary(s, i){
  const k = { submit:'filed by ' + (i.by || 'store'), intake:'intake completed', notify: s.text.replace(/ · .*$/, ''), response:'response from ' + (s.who || ''), resolve:'resolved', close:'closed', note:'internal note', escalate:'escalated' }[s.kind];
  return k || s.kind;
}
function rankTodo(){
  const out = [];
  ALL.filter(i => i.open).forEach(i => {
    let score = 0, why = '', cta = 'Open', urgent = false;
    if (i.status === 'Escalated') { score = 95; why = 'Escalated · needs a decision'; urgent = true; }
    else if (i.overdue) { score = i.severity === 'High' ? 100 : 80; why = `Reply overdue · ${i.waitingOn}${i.severity === 'High' ? ' · food safety' : ''}`; cta = 'Chase'; urgent = true; }
    else if (i.status === 'PendingIntake') { score = (TYPE_Q[i.type] && TYPE_Q[i.type].high ? 90 : 70) + (Date.now() - i.submittedAt) / D; why = 'New report · intake'; cta = 'Start intake'; }
    else if (i.status === 'IntakeComplete') { score = 65; why = 'Intake done · notify ' + (i.route === 'dc' ? 'DC' : 'supplier'); cta = 'Notify'; }
    else if ((i.status === 'SupplierNotified' || i.status === 'AwaitingDcAction') && i.respAfter) { score = 60; why = `${i.status === 'AwaitingDcAction' ? 'DC' : 'Supplier'} answered · ready to resolve`; cta = 'Resolve'; }
    else if (i.status === 'AwaitingDcAction' && i.severity === 'High') { score = 55; why = 'Food safety · waiting on ' + i.dc; cta = 'Check'; }
    if (score) out.push({ i, score, why, cta, urgent });
  });
  return out.sort((a, b) => b.score - a.score);
}

function stages(i){

    { l: i.route === 'dc' || i.status === 'AwaitingDcAction' ? 'DC notified' : 'Supplier notified', done: !!has('notify'), at: at('notify') },
    { l:'Response', done: i.hasResponse, at: at('response') },

function lightbox(i, idx){
  const ph = i.photos; let k = idx;
  const el = document.createElement('div');
  el.className = 'lightbox'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Photo viewer');
  const draw = () => {
    el.innerHTML = `<div class="lh"><div><b>${esc(ph[k].label)}</b><small>${k + 1} / ${ph.length} · ${esc(i.ref)}</small></div><button class="close" aria-label="Close">${ic('x')}</button></div>
      <div class="stage"><button class="nav-b prev" aria-label="Previous">${ic('left')}</button><img src="${esc(ph[k].src)}" alt="${esc(ph[k].label)}" draggable="false"><button class="nav-b next" aria-label="Next">${ic('right')}</button></div>
      <div class="lf">${ph.map((p, n) => `<button class="${n === k ? 'on' : ''}" data-n="${n}"><img src="${esc(p.src)}" alt=""></button>`).join('')}</div>`;
    el.querySelector('.close').onclick = close;
    el.querySelector('.prev').onclick = () => step(-1);
    el.querySelector('.next').onclick = () => step(1);
    $$('.lf button', el).forEach(b => b.onclick = () => { k = +b.dataset.n; draw(); });
  };
  const step = d => { k = (k + d + ph.length) % ph.length; draw(); };
  const key = e => { if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'Escape') close(); };
  function close(){ el.remove(); document.removeEventListener('keydown', key); galIdx = k; if (galRef === i.ref && location.hash.startsWith('#/incident/')) viewIncident($('#view'), i.ref); }
  let sx = null, sy = 0;
  el.addEventListener('pointerdown', e => { if (e.target.closest('.stage')) { sx = e.clientX; sy = e.clientY; } });
  el.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx, dy = Math.abs(e.clientY - sy); if (Math.abs(dx) > 50 && dy < 80) step(dx < 0 ? 1 : -1); sx = null; });
  document.addEventListener('keydown', key);
  draw();
  document.body.appendChild(el);
}

function weeks(){
  const now = Date.now(); return Array.from({ length: 12 }, (_, w) => new Date(now - (11 - w) * 7 * D));
}
function liveByWeek(){ const a = Array(12).fill(0); ALL.forEach(i => { const w = weekIdx(i.submittedAt); if (w >= 0 && w < 12) a[w]++; }); return a; }
function histByWeek(filter){ const a = Array(12).fill(0); HIST.forEach(h => { if (!filter || filter(h)) a[h.week]++; }); return a; }
function vbars(vals, labels, opts = {}){
  const W = 560, Hh = 200, pl = 28, pb = 26, pt = 18, max = Math.max(4, ...vals), n = vals.length, bw = (W - pl) / n;
  const nice = Math.ceil(max / 4) * 4, ticks = [0, nice / 2, nice];
  const y = v => pt + (Hh - pt - pb) * (1 - v / nice);
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(opts.aria || 'Bar chart')}">
    ${ticks.map(t => `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#EEEAE6"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
    ${vals.map((v, k) => { const x = pl + k * bw + bw * 0.18, w = bw * 0.64, h = Hh - pb - y(v), last = k === n - 1;

function supStats(s){
  const live = ALL.filter(i => i.sup && i.sup.key === s.key);

  const replies = live.flatMap(i => { const n = i.timeline.find(x => x.kind === 'notify'), r = i.timeline.find(x => x.kind === 'response'); return n && r && role(r, i).r === 'supplier' ? [(r.at - n.at) / H] : []; }).concat(hist.map(h => h.replyHrs));
  return { open: live.filter(i => i.open).length, resolved: live.filter(i => i.status === 'Resolved' && Date.now() - i.resolvedAt < 30 * D).length + hist.filter(h => h.week >= 7).length,
    reply: replies.length ? Math.round(replies.reduce((a, b) => a + b, 0) / replies.length) : null, overdue: live.filter(i => i.overdue).length,
    credits: live.reduce((a, i) => a + (i.credit || 0), 0) + hist.reduce((a, h) => a + h.credit, 0), total: live.length + hist.length };
}

      ${t.map((d, k) => `<tr><td class="nowrap">${ic('tablet')} <b>${d[0]}</b></td><td class="nowrap">Store ${d[1]} · ${d[2]} ${PILOT.includes(d[1]) ? '<span class="tag">Pilot</span>' : ''}</td><td>${d[3] === 'Enrolled' ? '<span class="pill t-green">Enrolled</span>' : '<span class="pill t-gold">Pending · RGV pilot</span>'}</td><td class="nowrap muted">${d[4]}</td><td>${sw('kiosk' + k, d[5])}</td><td>${d[3] === 'Enrolled' ? `<a class="btn sm ghost" href="../quip/">${ic('ext')}Open</a>` : `<button class="btn sm" data-enroll="${d[1]}">Send code</button>`}</td></tr>`).join('')}
    </tbody></table></div></section>`;
  } else if (tab === 'types') {
    body = `<section class="card"><div class="card-h"><div><h3>Incident types</h3><div class="muted small">What the store picks, and the one question the tablet asks for each</div></div><button class="btn sm" data-add="type">${ic('plus')}Add type</button></div><div class="tablewrap"><table class="t"><thead><tr><th>Type</th><th>Group</th><th>Question asked on the tablet</th><th>Default severity</th><th>Enabled</th></tr></thead><tbody>
      ${Q.INCIDENT_TYPES.map((t, k) => `<tr><td class="nowrap"><b>${esc(t.name)}</b></td><td>${esc(t.group)}</td><td class="small" style="min-width:260px">${esc(t.q)}</td><td>${t.high ? sev('High') : t.group === 'Service' ? '<span class="sev-none">—</span>' : sev('Medium')}</td><td>${sw('type' + k, true)}</td></tr>`).join('')}
    </tbody></table></div></section>`;
  } else {
    const rules = [['High severity filed or escalated','Post to QA Teams channel “QA – Food Safety” instantly', true],['Supplier or DC reply overdue (48 h)','One Teams message to the assigned QA person', true],['New report, normal severity','Included in daily digest at 7:00 CT', true],['Supplier or DC replies','Badge in QUIP only · no email', true],['Every status change','Email to QA team', false]];
    body = `<div class="banner gold" style="margin-bottom:14px">${ic('bell')}<div><b>Fewer, targeted alerts.</b> One alert per decision point, everything else in the morning digest.</div></div>
    <section class="card"><div class="card-h"><h3>Notification rules</h3></div>${rules.map((r, k) => `<div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid #EEEAE6"><div style="flex:1"><b>${esc(r[0])}</b><div class="muted small">${esc(r[1])}</div></div>${sw('rule' + k, r[2])}</div>`).join('')}
    <div style="padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="lbl">Daily digest</span><select class="inp" style="width:auto" id="dg"><option>6:30 CT</option><option selected>7:00 CT</option><option>8:00 CT</option></select><span class="muted small">to Tasha, Jennifer, Grace</span></div></section>`;
  }
  v.innerHTML = `<div class="pagehead"><div><div class="eyebrow">Admin</div><h1 style="margin-top:6px">Settings &amp; access</h1></div></div>
    <nav class="tabs">${tabs.map(([k, l]) => `<a href="#/admin/${k}" class="${tab === k ? 'on' : ''}">${l}</a>`).join('')}</nav>${body}`;
  bindSwitches(v, (id, on) => id.startsWith('kiosk') ? (on ? 'Kiosk lock on · tablet opens straight to QUIP' : 'Kiosk lock off') : id.startsWith('rule') ? (on ? 'Rule on' : 'Rule off — fewer alerts') : id.startsWith('type') ? (on ? 'Type shown on store tablets' : 'Type hidden from store tablets') : (on ? 'User activated' : 'User deactivated'));
  $$('[data-add]', v).forEach(b => b.onclick = () => toast({ user:'Invite sent — they sign in with their Church\'s Microsoft account', tablet:'Enrollment code: 4827-19 · valid 24 h', type:'New type drafted — add its tablet question to publish' }[b.dataset.add], 'ok'));
  $$('[data-enroll]', v).forEach(b => b.onclick = () => toast(`Enrollment code sent to Store ${b.dataset.enroll} GM`, 'ok'));
  const dg = $('#dg', v); if (dg) dg.onchange = () => toast('Digest moved to ' + dg.value, 'ok');
}

    ['McCain QA Desk','McCain','qa.notifications@mccainfoods.example','Active','4 h ago'],['Lamb Weston Customer Quality','Lamb Weston','customer.quality@lambweston.example','Active','1 day ago'],
    ['Koch Foods QA','Koch Foods','qa.desk@kochfoods.example','Active','6 days ago'],['Case Farms QA','Case Farms','quality@casefarms.example','Active','20 h ago'],
    ['GreenGate Food Safety','GreenGate Fresh','foodsafety@greengatefresh.example','Active','2 days ago'],['Ardent Mills Quality','Ardent Mills','quality.alerts@ardentmills.example','Invited','—'],

  : [['PFG Houston Service Desk','PFG Houston','houston.service@pfgc.example','Invited','—'],['PFG Bakersfield Service Desk','PFG Bakersfield','bakersfield.service@pfgc.example','Active','18 h ago'],
    ['PFG RFS Arizona Service Desk','PFG RFS Arizona','rfs.arizona.service@pfgc.example','Active','19 days ago'],['PFG Victoria Service Desk','PFG Victoria','victoria.service@pfgc.example','Invited','—'],
    ['PFG Little Rock Service Desk','PFG Little Rock','littlerock.service@pfgc.example','Active','5 days ago'],['PFG Atlanta Service Desk','PFG Atlanta','atlanta.service@pfgc.example','Not invited','—']];

  <section class="card"><div class="tablewrap"><table class="t"><thead><tr><th>Contact</th><th>${sup ? 'Supplier' : 'DC'}</th><th>Email</th><th>Status</th><th>Last sign-in</th><th>Portal access</th><th></th></tr></thead><tbody>
    ${rows.map((r, k) => `<tr><td class="nowrap"><b>${esc(r[0])}</b></td><td class="nowrap">${esc(r[1])}</td><td class="mono small">${esc(r[2])}</td>
      <td>${r[3] === 'Active' ? '<span class="pill t-green">Active</span>' : r[3] === 'Invited' ? '<span class="pill t-blue">Invited</span>' : '<span class="pill t-grey">Not invited</span>'}</td>
      <td class="nowrap muted small">${r[4]}</td><td>${sw(kind + 'acc' + k, r[3] !== 'Not invited')}</td>
      <td>${r[3] === 'Active' ? '' : `<button class="btn sm" data-inv="${esc(r[0])}">${r[3] === 'Invited' ? 'Resend' : 'Invite'}</button>`}</td></tr>`).join('')}
  </tbody></table></div></section>

  $$('[data-inv]', v).forEach(b => b.onclick = () => toast('Invite sent to ' + b.dataset.inv, 'ok'));
  $('#inv').onclick = () => modal({ title:`Invite ${sup ? 'supplier' : 'DC'} contact`, body:`<div class="field"><label for="ivn">Name</label><input class="inp" id="ivn" placeholder="${sup ? 'e.g. Bunge QA' : 'e.g. PFG Atlanta Service Desk'}"></div><div class="field"><label for="ive">Email</label><input class="inp" id="ive" type="email" placeholder="name@company.example"></div>`,
    actions:[{ label:'Cancel' }, { label:'Send invite', cls:'pri', icon:'send', fn(m){ const n = $('#ivn', m).value.trim() || 'contact'; toast('Invite sent to ' + n, 'ok'); } }] });

/* ================= DOCS ================= */
function viewDocs(v){
  v.innerHTML = `<div class="pagehead"><div><div class="eyebrow">Documentation</div><h1 style="margin-top:6px">QA team SOP</h1><p>How Tasha, Jennifer and Grace work an incident in QUIP. One owner per step, one alert per decision.</p></div><span class="mocknote">${ic('book')}v0.3 · pilot draft</span></div>
  <section class="card"><ol class="sop">
    <li><h3>Intake — same business day</h3><ul><li>Open the oldest <b>Pending intake</b> first; High-default types (Foreign Object, Spoilage) jump the line.</li><li>Check photos match the description; confirm lot, CIN and use-by are readable.</li><li>Set severity: <b>High</b> = possible food-safety or injury risk; Medium = quality / credit; Low = trend only.</li><li>Tell the store what to hold. Nothing gets thrown out until QA or the supplier says so.</li></ul></li>
    <li><h3>Route — supplier or DC</h3><ul><li><b>Supplier</b> when the problem was made at pack (fill, foreign object, coding, appearance).</li><li><b>DC</b> when it happened in transit (damage at receiving, temperature abuse, late or short).</li><li>Only approved suppliers for that CIN are offered. Wrong call? Use <b>Correct routing</b> — never cancel and refile.</li></ul></li>
    <li><h3>Notify</h3><ul><li>Preview, then send by email or Teams. Photos and lot attach automatically.</li><li>Reply due in 48 h (24 h for High). Overdue replies surface on the Morning Brief — chase once, then phone.</li></ul></li>
    <li><h3>Record the response</h3><ul><li>Paste or summarise the supplier's or DC's answer: root cause, corrective action, credit.</li><li>Phone answers count — record who said it and when.</li></ul></li>
    <li><h3>Resolve</h3><ul><li>Resolve only on a recorded response — nothing resolves on a note alone.</li><li>Enter the credit if one was issued; the store is told automatically.</li><li>Use <b>Close · no action</b> only for duplicates, non-issues, or trend-only service reports.</li></ul></li>
  </ol></section>`;
}

/* ---------- global search ---------- */
let hlIdx = -1;
function searchResults(q){
  q = q.trim().toLowerCase(); if (!q) return [];
  const qd = q.replace(/^qa-?2026-?0*/, '');
  return ALL.filter(i => i.ref.toLowerCase().includes(q) || (qd && i.ref.endsWith(qd.padStart(6, '0'))) || (i.lot || '').toLowerCase().includes(q) || i.store.num === q || i.store.num.includes(q) && q.length >= 3 || (i.store.name || '').toLowerCase().includes(q) || i.headline.toLowerCase().includes(q) || (i.vendor || '').toLowerCase().includes(q) || (i.itemObj && i.itemObj.name.toLowerCase().includes(q))).slice(0, 8);
}
function drawSearch(){
  const q = $('#search').value, d = $('#searchDrop');
  if (!q.trim()) { d.hidden = true; return; }
  const r = searchResults(q); hlIdx = r.length ? 0 : -1;
  d.innerHTML = r.length ? r.map((i, k) => `<button class="row ${k === 0 ? 'hl' : ''}" data-ref="${i.ref}"><span class="mono" style="font-weight:600;font-size:13px">${i.ref}</span><span style="flex:1;min-width:0"><b style="display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(i.headline)}</b><small class="muted">Store ${esc(i.store.num)}${i.lot ? ' · Lot ' + esc(i.lot) : ''}</small></span>${pill(i)}</button>`).join('')
    : `<div class="empty">No incident matches “${esc(q)}”. Try a ref (000005), a lot (KF1105) or a store number (10189).</div>`;
  d.hidden = false;
  $$('.row', d).forEach(b => b.onmousedown = e => { e.preventDefault(); pickSearch(b.dataset.ref); });
}
function pickSearch(ref){ $('#search').value = ''; $('#searchDrop').hidden = true; $('#search').blur(); go('#/incident/' + ref); }

/* ---------- top bar wiring ---------- */
function init(){
  $('#burger').innerHTML = ic('menu');
  $('#searchIco').outerHTML = ic('search');
  $('#burger').onclick = () => document.body.classList.toggle('drawer');
  $('#scrim').onclick = () => document.body.classList.remove('drawer');
  const s = $('#search');
  s.oninput = drawSearch;
  s.onfocus = drawSearch;
  s.onblur = () => setTimeout(() => $('#searchDrop').hidden = true, 120);
  s.onkeydown = e => {
    const rows = $$('#searchDrop .row');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!rows.length) return; hlIdx = (hlIdx + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length; rows.forEach((r, k) => r.classList.toggle('hl', k === hlIdx)); }
    else if (e.key === 'Enter') { if (rows[hlIdx]) pickSearch(rows[hlIdx].dataset.ref); }
    else if (e.key === 'Escape') { s.value = ''; $('#searchDrop').hidden = true; s.blur(); }
  };
  const bm = $('#bellMenu'), um = $('#userMenu');
  $('#bell').onclick = e => {
    e.stopPropagation(); um.hidden = true;
    const items = rankTodo();
    bm.innerHTML = `<div class="mh"><b>Needs you</b><small>${items.length} item${items.length === 1 ? '' : 's'} · ranked</small></div>${items.slice(0, 6).map(t => `<div class="nrow" data-ref="${t.i.ref}"><b ${t.urgent ? 'style="color:var(--red)"' : ''}>${esc(t.why)}</b><small><span class="mono">${t.i.ref}</span> · ${esc(t.i.headline)}</small></div>`).join('') || '<div class="nrow"><small>All clear.</small></div>'}<div class="nfoot">High severity also posts to the QA Teams channel. Everything else waits for the 7:00 digest.</div>`;
    $$('.nrow[data-ref]', bm).forEach(r => r.onclick = () => { bm.hidden = true; go('#/incident/' + r.dataset.ref); });
    bm.hidden = !bm.hidden;
  };
  $('#userBtn').onclick = e => {
    e.stopPropagation(); bm.hidden = true;
    um.innerHTML = `<div class="mh"><b>Tasha</b><small>QA Lead · demo account</small></div>
      <a href="../quip/">${ic('tablet')}Open crew tablet app</a>
      <a href="#/docs">${ic('book')}QA team SOP</a>
      <button class="danger" id="resetBtn">${ic('refresh')}Reset demo data</button>`;
    $('#resetBtn').onclick = () => { um.hidden = true; modal({ title:'Reset demo data?', sub:'Puts every incident back to its starting state.',
      body:`<div class="banner gold">${ic('refresh')}<div>Clears QA actions taken in this demo and any reports filed from the crew tablet app on this device. Nothing outside this demo is touched.</div></div>`,
      actions:[{ label:'Cancel' }, { label:'Reset demo', cls:'danger', icon:'refresh', fn(){ Q.reset(); galRef = ''; checkNew(true); go('#/brief'); toast('Demo data reset', 'ok'); } }] }); };
    um.hidden = !um.hidden;
  };
  document.addEventListener('click', e => { if (!e.target.closest('#bellMenu')) bm.hidden = true; if (!e.target.closest('#userMenu')) um.hidden = true; });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (modalClose) closeModal(); bm.hidden = um.hidden = true; document.body.classList.remove('drawer'); }
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); s.focus(); }
  });
  // chart tooltips
  const tip = $('#tip');
  document.addEventListener('pointerover', e => { const t = e.target.closest('[data-tip]'); if (!t) { tip.style.opacity = 0; return; } tip.textContent = t.dataset.tip; tip.style.opacity = 1; });
  document.addEventListener('pointermove', e => { if (tip.style.opacity === '1') { const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY - 36) + 'px'; } });
  // new reports from the crew tablet (same device)
  const refresh = () => { if (document.visibilityState !== 'visible') return; const before = KNOWN ? KNOWN.size : 0; checkNew(false); if (KNOWN.size !== before && !modalClose) render(); else renderNav((location.hash || '#/brief').slice(2).split('/')[0]); };
  window.addEventListener('focus', refresh);
  document.addEventListener('visibilitychange', refresh);
  window.addEventListener('storage', e => { if (e.key === Q.KEY) { checkNew(false); if (!modalClose) render(); } });
  checkNew(true);
  lastRoute = location.hash.split('/')[1];
  if (!location.hash) history.replaceState(null, '', '#/brief');
  render();
}
init();
})();
</script>
